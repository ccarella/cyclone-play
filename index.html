<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#14081c" />
<title>CYCLONE</title>
<style>
:root{color-scheme:dark;--bg:#14081c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game{display:block;width:auto;height:auto;max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#14081c;touch-action:none}
</style>
</head>
<body>
<main id="frame"><canvas id="game" width="270" height="480" aria-label="Cyclone"></canvas></main>
<script>
(() => {
  "use strict";
  const W = 270, H = 480, CX = 135, CY = 258, RING_R = 108, EYE_R = 16, DEATH_R = 24, CONE_HALF = 0.38, WAVE_S = 75;
  const ENEMY_SPD_MIN = 5, ENEMY_SPD_MAX = 7.2, FIRST_ENEMY_SPD_MUL = 0.48, EARLY_SPD_MUL = 0.46, LATE_SPD_MUL = 1.18, FIRST_EXTRA_SPAWN_S = 3.6, SPAWN_INTERVAL_EARLY = 2.35, SPAWN_INTERVAL_LATE = 0.62;
  const PAL = { bg: "#14081c", arena: "#1c0c28", ring: "#ff3cac", ringDim: "#6b184c", cyan: "#3cf3ff", cyanDim: "#17808a", magenta: "#ff3cac", enemy: "#ff4d6d", gold: "#ffd84a", white: "#f4f1e8", ink: "#0a0410" };
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });
  const state = { mode: "title", t: 0, score: 0, timeLeft: WAVE_S, spawnAcc: 0, pickupAcc: 0, aim: -Math.PI / 2, enemies: [], pickups: [], gusts: [], fx: [], pops: [], swirl: [], shake: 0, hintT: 0, pulseCd: 0, gustCd: 0, endReason: "" };
  const input = { down: false, x: 0, y: 0, fromEye: false, moved: 0, samples: [] };
  let audioCtx = null;
  const GLYPH = { " ": "000000000000000", "0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111", "4": "101101111001001", "5": "111100111001111", "6": "111100111101111", "7": "111001010010010", "8": "111101111101111", "9": "111101111001111", A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110", E: "111100110100111", F: "111100110100100", G: "011100101101011", H: "101101111101101", I: "111010010010111", K: "101101110101101", L: "100100100100111", M: "101111111101101", N: "101111111111101", O: "010101101101010", P: "110101110100100", R: "110101110101101", S: "011100010001110", T: "111010010010010", U: "101101101101111", V: "101101101101010", W: "101101111111101", Y: "101101010010010", "+": "000010111010000", ":": "000010000010000", ".": "000000000000010", "/": "001001010100100", "-": "000000111000000" };
  function resize() { const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth; const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight; const scale = Math.min(vw / W, vh / H); canvas.style.width = `${Math.floor(W * scale)}px`; canvas.style.height = `${Math.floor(H * scale)}px`; }
  function canvasPos(e) { const rect = canvas.getBoundingClientRect(); return { x: ((e.clientX - rect.left) / rect.width) * W, y: ((e.clientY - rect.top) / rect.height) * H }; }
  function angNorm(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
  function angDiff(a, b) { return Math.abs(angNorm(a - b)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function ensureAudio() { if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }
  function beep(freq, dur, type, gain) { if (!audioCtx) return; const t0 = audioCtx.currentTime; const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = type || "square"; o.frequency.setValueAtTime(freq, t0); g.gain.setValueAtTime(gain ?? 0.05, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur); }
  function drawGlyph(ch, x, y, scale, color) { const bits = GLYPH[ch] || GLYPH[" "]; ctx.fillStyle = color; for (let i = 0; i < 15; i++) { if (bits[i] === "1") ctx.fillRect(x + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale); } }
  function drawText(text, x, y, scale, color, align) { const s = text.toUpperCase(); const w = s.length * (3 * scale + scale); let px = x; if (align === "center") px = Math.round(x - w / 2); if (align === "right") px = Math.round(x - w); for (let i = 0; i < s.length; i++) { drawGlyph(s[i], px, y, scale, color); px += 3 * scale + scale; } }
  function addFx(kind, extra) { state.fx.push({ kind, t: 0, life: extra.life ?? 0.35, ...extra }); }
  function addPop(text, x, y, color) { state.pops.push({ text, x, y, t: 0, color }); }
  function resetSwirl() { state.swirl = []; for (let i = 0; i < 18; i++) state.swirl.push({ a: rand(0, Math.PI * 2), r: rand(22, 42), s: rand(2.2, 4.4) }); }
  function startCredit() { state.mode = "play"; state.t = 0; state.score = 0; state.timeLeft = WAVE_S; state.spawnAcc = FIRST_EXTRA_SPAWN_S; state.pickupAcc = 2.4; state.aim = -Math.PI / 2; state.enemies = []; state.pickups = []; state.gusts = []; state.fx = []; state.pops = []; state.shake = 0; state.hintT = 5.2; state.pulseCd = 0; state.gustCd = 0; state.endReason = ""; resetSwirl(); spawnEnemy(-Math.PI / 2, FIRST_ENEMY_SPD_MUL); state.pickups.push({ a: Math.PI * 0.15, r: RING_R * 0.7, pulled: false, spin: 0 }); beep(220, 0.08, "square", 0.04); beep(330, 0.12, "square", 0.04); }
  function endCredit(reason) { state.mode = "end"; state.endReason = reason; state.shake = 6; if (reason === "death") beep(90, 0.35, "sawtooth", 0.06); else { beep(440, 0.1, "square", 0.05); beep(660, 0.18, "square", 0.05); } }
  function spawnEnemy(angle, speedMul) { if (state.enemies.length >= 14) return; state.enemies.push({ a: angle ?? rand(0, Math.PI * 2), r: RING_R - 2, spd: rand(ENEMY_SPD_MIN, ENEMY_SPD_MAX) * (speedMul ?? 1), flash: 0, wobble: rand(0, Math.PI * 2) }); }
  function spawnPickup() { if (state.pickups.length) return; state.pickups.push({ a: rand(0, Math.PI * 2), r: rand(RING_R * 0.58, RING_R * 0.82), pulled: false, spin: 0 }); }
  function fireGust() { if (state.gustCd > 0) return; state.gustCd = 0.22; state.gusts.push({ a: state.aim, r: EYE_R + 10, life: 0.42 }); addFx("slash", { a: state.aim, life: 0.18 }); beep(520, 0.07, "square", 0.045); beep(180, 0.1, "triangle", 0.03); sliceCone(); }
  function sliceCone() { for (const e of state.enemies) { if (angDiff(e.a, state.aim) <= CONE_HALF + 0.12 && e.r > EYE_R + 4) hitEnemy(e); } }
  function hitEnemy(e) { if (e.dead) return; e.dead = true; e.flash = 1; state.score += 100; addPop("+100", CX + Math.cos(e.a) * e.r * 0.72, CY + Math.sin(e.a) * e.r * 0.72 - 8, PAL.cyan); addFx("burst", { a: e.a, r: e.r, color: PAL.cyan, life: 0.28 }); state.shake = Math.max(state.shake, 2.4); beep(880, 0.05, "square", 0.04); }
  function pulseEye() { if (state.pulseCd > 0) return; state.pulseCd = 0.8; addFx("pulse", { life: 0.4 }); state.shake = 3; beep(140, 0.12, "triangle", 0.05); beep(280, 0.08, "square", 0.03); for (const e of state.enemies) { e.r = clamp(e.r + 30, DEATH_R + 4, RING_R - 2); e.flash = 0.5; } for (const p of state.pickups) p.pulled = true; addPop(state.pickups.length ? "PULL" : "KNOCK", CX, CY - 28, state.pickups.length ? PAL.gold : PAL.white); }
  function collectPickup(p) { p.dead = true; state.score += 250; addPop("+250", CX, CY - 36, PAL.gold); addFx("burst", { a: 0, r: 8, color: PAL.gold, life: 0.3 }); beep(740, 0.08, "square", 0.05); beep(980, 0.1, "square", 0.04); }
  function waveProgress() { return 1 - state.timeLeft / WAVE_S; }
  function spawnInterval() { return lerp(SPAWN_INTERVAL_EARLY, SPAWN_INTERVAL_LATE, waveProgress()); }
  function enemySpeedMul() { return lerp(EARLY_SPD_MUL, LATE_SPD_MUL, waveProgress()); }
  function updatePlay(dt) { state.t += dt; state.timeLeft -= dt; state.hintT = Math.max(0, state.hintT - dt); state.pulseCd = Math.max(0, state.pulseCd - dt); state.gustCd = Math.max(0, state.gustCd - dt); state.shake *= Math.pow(0.04, dt); if (state.timeLeft <= 0) { state.timeLeft = 0; endCredit("clear"); return; } state.spawnAcc -= dt; if (state.spawnAcc <= 0) { spawnEnemy(undefined, enemySpeedMul()); state.spawnAcc = spawnInterval(); } state.pickupAcc -= dt; if (state.pickupAcc <= 0) { spawnPickup(); state.pickupAcc = rand(9, 14); } for (const s of state.swirl) s.a += s.s * dt; for (const e of state.enemies) { e.wobble += dt * 8; e.flash = Math.max(0, e.flash - dt * 5); if (!e.dead) { e.r -= e.spd * dt; if (e.r <= DEATH_R) { endCredit("death"); return; } } } for (const g of state.gusts) { g.r += 420 * dt; g.life -= dt; for (const e of state.enemies) { if (!e.dead && angDiff(e.a, g.a) <= CONE_HALF + 0.04 && Math.abs(e.r - g.r) < 16) hitEnemy(e); } } for (const p of state.pickups) { p.spin += dt * 6; if (p.pulled) { p.r -= 160 * dt; if (p.r <= EYE_R + 6) collectPickup(p); } } state.enemies = state.enemies.filter((e) => !e.dead || e.flash > 0); state.pickups = state.pickups.filter((p) => !p.dead); state.gusts = state.gusts.filter((g) => g.life > 0 && g.r < RING_R + 8); for (const f of state.fx) f.t += dt; state.fx = state.fx.filter((f) => f.t < f.life); for (const p of state.pops) p.t += dt; state.pops = state.pops.filter((p) => p.t < 1.05); }
  function update(dt) { if (state.mode === "play") updatePlay(dt); else state.shake *= Math.pow(0.04, dt); }
  function polar(a, r) { return [CX + Math.cos(a) * r, CY + Math.sin(a) * r]; }
  function drawArena() { ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H); ctx.fillStyle = PAL.arena; ctx.beginPath(); ctx.arc(CX, CY, RING_R + 6, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = PAL.ink; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(CX, CY, RING_R + 5, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = PAL.ringDim; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, RING_R, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = PAL.ring; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, RING_R, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = PAL.ringDim; for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; const [x1, y1] = polar(a, RING_R - 5); const [x2, y2] = polar(a, RING_R + 3); ctx.fillRect(Math.round(x1), Math.round(y1), 2, 2); ctx.fillRect(Math.round(x2), Math.round(y2), 2, 2); } }
  function drawCone() { const a0 = state.aim - CONE_HALF, a1 = state.aim + CONE_HALF; ctx.fillStyle = "rgba(60,243,255,0.14)"; ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, RING_R - 1, a0, a1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = "rgba(60,243,255,0.55)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, RING_R - 1, a0, a1); ctx.stroke(); ctx.strokeStyle = PAL.cyan; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(CX, CY, RING_R, a0, a1); ctx.stroke(); ctx.strokeStyle = PAL.white; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, RING_R, a0 + 0.08, a1 - 0.08); ctx.stroke(); const [mx, my] = polar(state.aim, RING_R); ctx.fillStyle = PAL.white; ctx.fillRect(Math.round(mx) - 2, Math.round(my) - 2, 4, 4); }
  function drawEye() { ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(CX, CY, EYE_R + 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PAL.cyanDim; ctx.beginPath(); ctx.arc(CX, CY, EYE_R + 1, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PAL.cyan; ctx.beginPath(); ctx.arc(CX, CY, EYE_R - 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PAL.white; ctx.beginPath(); ctx.arc(CX, CY, EYE_R - 6, 0, Math.PI * 2); ctx.fill(); const [px, py] = polar(state.aim, 4); ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = PAL.white; ctx.fillRect(Math.round(px - 2), Math.round(py - 2), 2, 2); for (const s of state.swirl) { const [x, y] = polar(s.a + state.aim, s.r); ctx.fillStyle = "rgba(60,243,255,0.45)"; ctx.fillRect(Math.round(x), Math.round(y), 2, 2); } }
  function drawEnemies() { for (const e of state.enemies) { const [x, y] = polar(e.a, e.r); const j = Math.sin(e.wobble) * 1.2; ctx.fillStyle = e.flash > 0 || e.dead ? PAL.white : PAL.enemy; ctx.fillRect(Math.round(x - 5 + j), Math.round(y - 5), 10, 10); ctx.fillStyle = e.flash > 0 || e.dead ? PAL.white : PAL.magenta; ctx.fillRect(Math.round(x - 2), Math.round(y - 2), 4, 4); } }
  function drawPickups() { for (const p of state.pickups) { const [x, y] = polar(p.a, p.r); ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(p.spin); ctx.fillStyle = PAL.gold; ctx.fillRect(-3, -3, 6, 6); ctx.fillStyle = PAL.white; ctx.fillRect(-1, -4, 2, 8); ctx.fillRect(-4, -1, 8, 2); ctx.restore(); } }
  function drawGusts() { for (const g of state.gusts) { ctx.strokeStyle = PAL.cyan; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(CX, CY, g.r, g.a - CONE_HALF, g.a + CONE_HALF); ctx.stroke(); ctx.strokeStyle = PAL.white; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, CY, g.r + 3, g.a - CONE_HALF * 0.7, g.a + CONE_HALF * 0.7); ctx.stroke(); } }
  function drawFx() { for (const f of state.fx) { const k = 1 - f.t / f.life; if (f.kind === "pulse") { ctx.strokeStyle = `rgba(60,243,255,${0.7 * k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, EYE_R + 8 + f.t * 180, 0, Math.PI * 2); ctx.stroke(); } else if (f.kind === "slash") { ctx.strokeStyle = `rgba(244,241,232,${k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, 46, f.a - CONE_HALF, f.a + CONE_HALF); ctx.stroke(); } else if (f.kind === "burst") { const [x, y] = polar(f.a, f.r); ctx.fillStyle = f.color; for (let i = 0; i < 6; i++) { const aa = (i / 6) * Math.PI * 2; ctx.fillRect(Math.round(x + Math.cos(aa) * (10 * (1 - k))), Math.round(y + Math.sin(aa) * (10 * (1 - k))), 2, 2); } } } }
  function drawHud() { drawText("CYCLONE", W / 2, 14, 3, PAL.cyan, "center"); drawText(`SCORE ${String(state.score).padStart(5, "0")}`, W / 2, 36, 2, PAL.white, "center"); if (state.mode === "play") { drawText(`WAVE ${Math.ceil(state.timeLeft)}S`, W / 2, 54, 2, PAL.magenta, "center"); if (state.hintT > 0) { const c = state.hintT > 1 || state.hintT > 0.15 ? PAL.gold : PAL.ink; drawText("DRAG RING TO AIM", W / 2, 78, 1, c, "center"); drawText("FLICK OR TAP MOUTH", W / 2, 90, 1, c, "center"); drawText("TAP EYE TO PULSE", W / 2, 102, 1, c, "center"); } } }
  function drawTitle() { drawArena(); drawCone(); drawEye(); drawText("CYCLONE", W / 2, 56, 4, PAL.cyan, "center"); drawText("EYE OF THE STORM", W / 2, 86, 2, PAL.magenta, "center"); drawText("DRAG RING TO AIM", W / 2, 118, 2, PAL.white, "center"); drawText("FLICK OR TAP MOUTH", W / 2, 138, 2, PAL.white, "center"); drawText("TAP EYE TO PULSE", W / 2, 158, 2, PAL.white, "center"); drawText("TAP TO START", W / 2, H - 48, 2, PAL.gold, "center"); }
  function drawEnd() { drawArena(); drawCone(); drawEye(); drawEnemies(); drawText(state.endReason === "clear" ? "WAVE CLEAR" : "EYE HIT", W / 2, 86, 3, state.endReason === "clear" ? PAL.cyan : PAL.enemy, "center"); drawText("SCORE", W / 2, 126, 2, PAL.white, "center"); drawText(String(state.score).padStart(5, "0"), W / 2, 148, 4, PAL.gold, "center"); drawText("TAP TO RESTART", W / 2, H - 48, 2, PAL.gold, "center"); }
  function drawPlay() { ctx.save(); ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake); drawArena(); drawCone(); drawGusts(); drawPickups(); drawEnemies(); drawEye(); drawFx(); ctx.restore(); drawHud(); for (const p of state.pops) drawText(p.text, p.x, p.y - p.t * 32, 3, p.color, "center"); }
  function draw() { ctx.imageSmoothingEnabled = false; if (state.mode === "title") drawTitle(); else if (state.mode === "end") drawEnd(); else drawPlay(); }
  function flickSpeed() { const now = performance.now(); const recent = input.samples.filter((s) => now - s.t <= 140); if (recent.length < 2) return 0; const a = recent[0], b = recent[recent.length - 1]; const dt = (b.t - a.t) / 1000; return dt <= 0 ? 0 : Math.hypot(b.x - a.x, b.y - a.y) / dt; }
  function pointerDown(e) { e.preventDefault(); ensureAudio(); const p = canvasPos(e); const dx = p.x - CX, dy = p.y - CY, r = Math.hypot(dx, dy); input.down = true; input.x = p.x; input.y = p.y; input.fromEye = r <= EYE_R + 14; input.moved = 0; input.samples = [{ x: p.x, y: p.y, t: performance.now() }]; if (state.mode === "title" || state.mode === "end") return; if (!input.fromEye && r > 20) state.aim = Math.atan2(dy, dx); }
  function pointerMove(e) { if (!input.down) return; e.preventDefault(); const p = canvasPos(e); input.moved += Math.hypot(p.x - input.x, p.y - input.y); input.x = p.x; input.y = p.y; input.samples.push({ x: p.x, y: p.y, t: performance.now() }); if (input.samples.length > 12) input.samples.shift(); if (state.mode !== "play") return; if (input.fromEye && input.moved < 14) return; const dx = p.x - CX, dy = p.y - CY; if (Math.hypot(dx, dy) > 12) state.aim = Math.atan2(dy, dx); }
  function pointerUp(e) { if (!input.down) return; e.preventDefault(); input.down = false; const p = canvasPos(e); const dx = p.x - CX, dy = p.y - CY, r = Math.hypot(dx, dy); if (state.mode === "title" || state.mode === "end") { startCredit(); return; } if (state.mode !== "play") return; if ((input.fromEye && input.moved < 16) || (r <= EYE_R + 10 && input.moved < 16)) { pulseEye(); return; } if (flickSpeed() >= 260 || (r >= RING_R * 0.52 && input.moved < 16)) fireGust(); }
  canvas.addEventListener("pointerdown", pointerDown); canvas.addEventListener("pointermove", pointerMove); window.addEventListener("pointerup", pointerUp); window.addEventListener("pointercancel", pointerUp); canvas.addEventListener("contextmenu", (e) => e.preventDefault()); window.addEventListener("resize", resize); window.visualViewport?.addEventListener("resize", resize); resize(); resetSwirl();
  let last = performance.now(); function frame(now) { const dt = clamp((now - last) / 1000, 0, 0.05); last = now; update(dt); draw(); requestAnimationFrame(frame); } requestAnimationFrame(frame);
})();
</script>
</body>
</html>
