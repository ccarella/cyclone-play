<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#14081c" />
    <title>CYCLONE</title>
    <style>
:root { color-scheme: dark; --bg: #14081c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#frame { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#game { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #14081c; touch-action: none; }
    </style>
  </head>
  <body>
    <main id="frame">
      <canvas id="game" width="270" height="480" aria-label="Cyclone"></canvas>
    </main>
    <script src="game.js"></script>
  </body>
</html>
